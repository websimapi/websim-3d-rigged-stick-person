<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rigged Stick Person</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        #mesh-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            backdrop-filter: blur(10px);
            max-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .control-group input {
            width: 100%;
            margin-bottom: 5px;
        }
        
        .mesh-control-group {
            margin-bottom: 15px;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }
        
        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .control-row span {
            width: 40px;
            font-size: 12px;
        }
        
        .control-row input {
            width: 60px;
            margin: 0 2px;
        }
        
        .mesh-control-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>Full Body Rig Controls</h3>
            <div class="control-group">
                <label>Head Rotation:</label>
                <input type="range" id="headRotX" min="-30" max="30" value="0" step="1">
                <input type="range" id="headRotY" min="-45" max="45" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Neck Rotation:</label>
                <input type="range" id="neckRotX" min="-20" max="20" value="0" step="1">
                <input type="range" id="neckRotY" min="-30" max="30" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Left Arm:</label>
                <input type="range" id="leftArmRotX" min="-90" max="90" value="0" step="1">
                <input type="range" id="leftArmRotZ" min="-180" max="180" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Left Elbow:</label>
                <input type="range" id="leftElbowRotX" min="-150" max="0" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Left Hand:</label>
                <input type="range" id="leftHandRotX" min="-45" max="45" value="0" step="1">
                <input type="range" id="leftHandRotY" min="-30" max="30" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Right Arm:</label>
                <input type="range" id="rightArmRotX" min="-90" max="90" value="0" step="1">
                <input type="range" id="rightArmRotZ" min="-180" max="180" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Right Elbow:</label>
                <input type="range" id="rightElbowRotX" min="-150" max="0" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Right Hand:</label>
                <input type="range" id="rightHandRotX" min="-45" max="45" value="0" step="1">
                <input type="range" id="rightHandRotY" min="-30" max="30" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Left Leg:</label>
                <input type="range" id="leftLegRotX" min="-90" max="90" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Left Knee:</label>
                <input type="range" id="leftKneeRotX" min="0" max="150" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Left Foot:</label>
                <input type="range" id="leftFootRotX" min="-45" max="45" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Right Leg:</label>
                <input type="range" id="rightLegRotX" min="-90" max="90" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Right Knee:</label>
                <input type="range" id="rightKneeRotX" min="0" max="150" value="0" step="1">
            </div>
            <div class="control-group">
                <label>Right Foot:</label>
                <input type="range" id="rightFootRotX" min="-45" max="45" value="0" step="1">
            </div>
            <button onclick="stickPerson.resetPose()">Reset Pose</button>
            <button onclick="stickPerson.testAnimation()">Test Animation</button>
        </div>
        
        <div id="mesh-controls">
            <h3>Mesh Positioning & Scaling</h3>
            <button onclick="toggleMeshControls()">Toggle Mesh Controls</button>
            <div id="mesh-controls-content" style="display: none;">
                <div class="mesh-control-group">
                    <label>Head:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="head-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="head-pos-y" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="head-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="head-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="head-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="head-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Neck:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="neck-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="neck-pos-y" min="-0.5" max="0.5" value="0.075" step="0.01">
                        <input type="range" id="neck-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="neck-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="neck-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="neck-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Chest:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="chest-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="chest-pos-y" min="-0.5" max="0.5" value="0.15" step="0.01">
                        <input type="range" id="chest-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="chest-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="chest-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="chest-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Spine:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="spine-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="spine-pos-y" min="-0.5" max="0.5" value="0.25" step="0.01">
                        <input type="range" id="spine-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="spine-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="spine-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="spine-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Left Arm:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="leftArm-pos-x" min="-0.5" max="0.5" value="-0.06" step="0.01">
                        <input type="range" id="leftArm-pos-y" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="leftArm-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="leftArm-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftArm-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftArm-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Left Forearm:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="leftForearm-pos-x" min="-0.5" max="0.5" value="-0.06" step="0.01">
                        <input type="range" id="leftForearm-pos-y" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="leftForearm-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="leftForearm-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftForearm-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftForearm-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Right Arm:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="rightArm-pos-x" min="-0.5" max="0.5" value="0.06" step="0.01">
                        <input type="range" id="rightArm-pos-y" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="rightArm-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="rightArm-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightArm-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightArm-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Right Forearm:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="rightForearm-pos-x" min="-0.5" max="0.5" value="0.06" step="0.01">
                        <input type="range" id="rightForearm-pos-y" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="rightForearm-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="rightForearm-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightForearm-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightForearm-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Left Thigh:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="leftThigh-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="leftThigh-pos-y" min="-0.5" max="0.5" value="-0.125" step="0.01">
                        <input type="range" id="leftThigh-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="leftThigh-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftThigh-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftThigh-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Left Shin:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="leftShin-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="leftShin-pos-y" min="-0.5" max="0.5" value="-0.125" step="0.01">
                        <input type="range" id="leftShin-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="leftShin-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftShin-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="leftShin-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Right Thigh:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="rightThigh-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="rightThigh-pos-y" min="-0.5" max="0.5" value="-0.125" step="0.01">
                        <input type="range" id="rightThigh-pos-z" min="-0.5" max="0.5" value="0" step="0.01">
                    </div>
                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="rightThigh-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightThigh-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightThigh-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <div class="mesh-control-group">
                    <label>Right Shin:</label>
                    <div class="control-row">
                        <span>Pos:</span>
                        <input type="range" id="rightShin-pos-x" min="-0.5" max="0.5" value="0" step="0.01">
                        <input type="range" id="rightShin-pos-y" min="-0.5" max="0.5" value="-0.125" step="0.01">
                        <input type="range" id="rightShin-pos-z" min="-0.5" max="0.5" value="0" step="0.01">

                    <div class="control-row">
                        <span>Scale:</span>
                        <input type="range" id="rightShin-scale-x" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightShin-scale-y" min="0.1" max="3" value="1" step="0.1">
                        <input type="range" id="rightShin-scale-z" min="0.1" max="3" value="1" step="0.1">
                    </div>
                </div>
                
                <button onclick="stickPerson.logCurrentValues()">Log Current Values</button>
                <button onclick="stickPerson.resetMeshValues()">Reset Mesh Values</button>
            </div>
        </div>
        
        <div id="info">
            <p>Mouse: Orbit camera | Scroll: Zoom | WASD: Move camera</p>
            <p>Use controls to pose the stick figure</p>
        </div>
    </div>
    
    <script type="importmap">

        }
    }
    </script>
